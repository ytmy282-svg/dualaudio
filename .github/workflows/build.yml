
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/dualaudio

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DualAudio"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.dualaudio"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.dualaudio"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Dual Audio"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/dualaudio/MainActivity.kt <<'EOF'
          package com.example.dualaudio

          import android.media.AudioAttributes
          import android.media.AudioDeviceInfo
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private var btPlayer: MediaPlayer? = null
              private var wiredPlayer: MediaPlayer? = null
              private var songUri: Uri? = null
              private var wiredDelayMs = 0
              private val handler = Handler(Looper.getMainLooper())
              private lateinit var status: TextView

              private val pickSong = registerForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  if (uri != null) {
                      songUri = uri
                      status.text = "গান বাছাই হয়েছে। এবার Play চাপুন।"
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(48, 96, 48, 48)
                  }

                  val pickBtn = Button(this).apply {
                      text = "গান বাছুন"
                      setOnClickListener { pickSong.launch(arrayOf("audio/*")) }
                  }
                  val playBtn = Button(this).apply {
                      text = "Play (দুই হেডফোনে)"
                      setOnClickListener { playBoth() }
                  }
                  val stopBtn = Button(this).apply {
                      text = "Stop"
                      setOnClickListener { stopAll(); status.text = "থেমেছে" }
                  }

                  val delayLabel = TextView(this).apply {
                      text = "তারের হেডফোনের ডিলে: 0 ms"
                      setPadding(0, 48, 0, 0)
                  }
                  val delayBar = SeekBar(this).apply {
                      max = 500
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              wiredDelayMs = p
                              delayLabel.text = "তারের হেডফোনের ডিলে: $p ms"
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }

                  status = TextView(this).apply {
                      text = "প্রথমে গান বাছুন"
                      setPadding(0, 48, 0, 0)
                  }

                  listOf(pickBtn, playBtn, stopBtn, delayLabel, delayBar, status).forEach {
                      root.addView(it, LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ))
                  }
                  setContentView(root)
              }

              private fun findDevices(): Pair<AudioDeviceInfo?, AudioDeviceInfo?> {
                  val am = getSystemService(AUDIO_SERVICE) as AudioManager
                  val outs = am.getDevices(AudioManager.GET_DEVICES_OUTPUTS)
                  val wired = outs.firstOrNull {
                      it.type == AudioDeviceInfo.TYPE_WIRED_HEADPHONES ||
                          it.type == AudioDeviceInfo.TYPE_WIRED_HEADSET
                  }
                  val bt = outs.firstOrNull { it.type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP }
                  return wired to bt
              }

              private fun buildPlayer(uri: Uri, device: AudioDeviceInfo): MediaPlayer =
                  MediaPlayer().apply {
                      setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build()
                      )
                      setDataSource(this@MainActivity, uri)
                      setPreferredDevice(device)
                      prepare()
                  }

              private fun playBoth() {
                  val uri = songUri ?: run { status.text = "আগে গান বাছুন"; return }
                  val (wired, bt) = findDevices()

                  if (wired == null || bt == null) {
                      status.text = "তারের হেডফোন: ${if (wired != null) "পাওয়া গেছে" else "নেই"}\n" +
                          "ব্লুটুথ: ${if (bt != null) "পাওয়া গেছে" else "নেই"}\n" +
                          "দুটোই কানেক্ট করে আবার চেষ্টা করুন"
                      return
                  }

                  stopAll()
                  try {
                      btPlayer = buildPlayer(uri, bt)
                      wiredPlayer = buildPlayer(uri, wired)

                      btPlayer?.start()
                      handler.postDelayed({ wiredPlayer?.start() }, wiredDelayMs.toLong())

                      status.text = "চলছে। শব্দ আগে-পরে শোনালে স্লাইডার দিয়ে ডিলে ঠিক করুন।"
                  } catch (e: Exception) {
                      status.text = "ব্যর্থ: ${e.message}"
                      stopAll()
                  }
              }

              private fun stopAll() {
                  handler.removeCallbacksAndMessages(null)
                  btPlayer?.release(); btPlayer = null
                  wiredPlayer?.release(); wiredPlayer = null
              }

              override fun onDestroy() {
                  stopAll()
                  super.onDestroy()
              }
          }
          EOF

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DualAudio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
